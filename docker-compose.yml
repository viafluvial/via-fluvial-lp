name: via-fluvial-lp

# Execucao local da imagem de producao (nginx + site estatico + proxy dos formularios).
#   docker compose up --build        ->  http://localhost:8081
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        APP_BUILD_ID: local
        APP_VERSION: dev
    image: via-fluvial-lp:local
    container_name: via-fluvial-lp-web
    ports:
      - "8081:80"
    environment:
      VIA_FLUVIAL_API_ADMINISTRACAO_BACKEND_URL: ${VIA_FLUVIAL_API_ADMINISTRACAO_BACKEND_URL:-https://api-administracao.api.plataforma.prd.viafluvial.com.br/api/v1}
      VIA_FLUVIAL_API_NOTIFICACOES_BACKEND_URL: ${VIA_FLUVIAL_API_NOTIFICACOES_BACKEND_URL:-https://api-notificacoes.api.plataforma.prd.viafluvial.com.br/api/v1}
      VIA_FLUVIAL_API_RESERVAS_BACKEND_URL: ${VIA_FLUVIAL_API_RESERVAS_BACKEND_URL:-https://api-reservas.api.plataforma.prd.viafluvial.com.br/api/v1}
      PLATFORM_STATS_ENABLED: ${PLATFORM_STATS_ENABLED:-false}
      # Telemetria local desligada por padrão (sem chave do Coroot o nginx descarta os spans).
      VIA_FLUVIAL_OTEL_ENABLED: ${VIA_FLUVIAL_OTEL_ENABLED:-false}
    restart: unless-stopped
