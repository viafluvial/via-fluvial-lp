name: Deploy Production (Application Cluster)

on:
  workflow_dispatch:
    inputs:
      deploy_stack:
        description: 'Deploy da stack no Portainer (API)'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

env:
  REGISTRY: docker.io
  DEFAULT_DOCKERHUB_NAMESPACE: viafluvial
  IMAGE_NAME: via-fluvial-lp
  DEFAULT_PORTAINER_URL: 'https://portainer.application.plataforma.prd.viafluvial.com.br'
  DEFAULT_PORTAINER_ENDPOINT_NAME: 'application'
  DEFAULT_PORTAINER_STACK_NAME: 'viafluvial-sobre-lp-prd'

jobs:
  build-and-push-image:
    name: Build and Push Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate DockerHub credentials
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${DOCKERHUB_USERNAME:-}" || -z "${DOCKERHUB_TOKEN:-}" ]]; then
            echo "DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets must be set (Settings > Secrets and variables > Actions > Secrets)."
            exit 1
          fi
          echo "username=${DOCKERHUB_USERNAME%%/*}" >> "$GITHUB_OUTPUT"

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ steps.dockerhub.outputs.username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image reference
        id: image
        run: |
          echo "ref=${{ env.REGISTRY }}/${{ env.DEFAULT_DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "latest_ref=${{ env.REGISTRY }}/${{ env.DEFAULT_DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ steps.image.outputs.latest_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-stack:
    name: Deploy Stack via Portainer API
    needs:
      - build-and-push-image
    if: needs.build-and-push-image.result == 'success' && inputs.deploy_stack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Deploy stack via Portainer API
        env:
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_APPLICATION_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${PORTAINER_API_KEY:-}" || (echo "PORTAINER_APPLICATION_API_KEY secret is required" && exit 1)
          python3 deployment/scripts/deploy-portainer-stack.py \
            --portainer-url "${{ env.DEFAULT_PORTAINER_URL }}" \
            --portainer-api-key "$PORTAINER_API_KEY" \
            --endpoint-name "${{ env.DEFAULT_PORTAINER_ENDPOINT_NAME }}" \
            --stack-name "${{ env.DEFAULT_PORTAINER_STACK_NAME }}" \
            --compose-file deployment/portainer/stack.sobre.yml \
            --env-file deployment/portainer/stack.env.example \
            --image "${{ needs.build-and-push-image.outputs.image }}" \
            --prune true \
            --pull-image true

      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            if curl -fsS https://sobre.viafluvial.com.br/ >/dev/null; then echo "sobre.viafluvial.com.br OK"; exit 0; fi
            sleep 15
          done
          echo "::error::sobre.viafluvial.com.br não respondeu"
          exit 1
