version: "3.9"

services:
  via-fluvial-app-sobre:
    image: "${APP_IMAGE}"
    environment:
      # O nginx do site encaminha os formulários para estes backends (o navegador nunca os chama direto).
      VIA_FLUVIAL_API_ADMINISTRACAO_BACKEND_URL: "${VIA_FLUVIAL_API_ADMINISTRACAO_BACKEND_URL:-https://api-administracao.api.plataforma.prd.viafluvial.com.br/api/v1}"
      VIA_FLUVIAL_API_NOTIFICACOES_BACKEND_URL: "${VIA_FLUVIAL_API_NOTIFICACOES_BACKEND_URL:-https://api-notificacoes.api.plataforma.prd.viafluvial.com.br/api/v1}"
      VIA_FLUVIAL_API_RESERVAS_BACKEND_URL: "${VIA_FLUVIAL_API_RESERVAS_BACKEND_URL:-https://api-reservas.api.plataforma.prd.viafluvial.com.br/api/v1}"
      # Faixa "números da plataforma" (5.9): ligue (true) só depois do lançamento oficial.
      PLATFORM_STATS_ENABLED: "${PLATFORM_STATS_ENABLED:-false}"
      # Chave OTLP do Coroot: vem do GitHub Actions secret COROOT_API_KEY (ambiente do deploy), nunca versionada.
      # Vazia = o nginx aceita e descarta a telemetria. As demais variáveis só expõem flags ao navegador (/config.js).
      COROOT_API_KEY: "${COROOT_API_KEY:-}"
      VIA_FLUVIAL_OTEL_ENABLED: "${VIA_FLUVIAL_OTEL_ENABLED:-true}"
      VIA_FLUVIAL_OTEL_SAMPLE_RATIO: "${VIA_FLUVIAL_OTEL_SAMPLE_RATIO:-1.0}"
      VIA_FLUVIAL_ENVIRONMENT: "${VIA_FLUVIAL_ENVIRONMENT:-prd}"
    networks:
      - service-public
    deploy:
      mode: replicated
      replicas: ${STACK_REPLICAS:-2}
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.docker.network=service-public
        - traefik.constraint-label=service-public
        - traefik.http.routers.sobre-viafluvial-prd-http.rule=Host(`${DOMAIN_PRIMARY}`) || Host(`${DOMAIN_WWW}`)
        - traefik.http.routers.sobre-viafluvial-prd-http.entrypoints=http
        - traefik.http.routers.sobre-viafluvial-prd-http.middlewares=https-redirect
        - traefik.http.routers.sobre-viafluvial-prd-https.rule=Host(`${DOMAIN_PRIMARY}`) || Host(`${DOMAIN_WWW}`)
        - traefik.http.routers.sobre-viafluvial-prd-https.entrypoints=https
        - traefik.http.routers.sobre-viafluvial-prd-https.tls=true
        - traefik.http.routers.sobre-viafluvial-prd-https.tls.certresolver=letsencrypt
        - traefik.http.routers.sobre-viafluvial-prd-https.service=sobre-viafluvial-prd
        - traefik.http.services.sobre-viafluvial-prd.loadbalancer.server.port=80
        - traefik.http.services.sobre-viafluvial-prd.loadbalancer.server.scheme=http

networks:
  service-public:
    external: true
    name: service-public
